# Vérifie le code à chaque push et pull request,
# puis publie l'image Docker sur GitHub Container Registry (ghcr.io)
# uniquement pour la branche main.

name: Docker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---- Étape 1 : lint, types et tests unitaires ----
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version de pnpm lue dans "packageManager" (package.json)
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit
      - run: pnpm test

  # ---- Étape 2 : construire et publier l'image ----
  # Ne démarre que si les tests passent
  build-and-push:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN est fourni automatiquement par GitHub : aucun secret à créer
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags : "latest" + le hash court du commit (ex : sha-ce16e25)
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
